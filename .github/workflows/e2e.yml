name: E2E

# The main chain (adopt, manifest/lock/ownership, plan, apply, runtime, rollback, remove) against a real
# npm DSH. Kept apart from CI because it needs the npm registry and a running dsh web; a required check on master.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'npm version or dist-tag of @deepseek-ai/dsh'
        default: '0.1.7-rc.2'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The verified DSH family; a new family is added here once the version gate is widened for it.
      # The input reaches the script through env, so it is never spliced into the shell text.
      - run: scripts/e2e-dsh.sh "$DSH_VERSION" "$RUNNER_TEMP/e2e"
        env:
          DSH_VERSION: ${{ inputs.dsh_version || '0.1.7-rc.2' }}
