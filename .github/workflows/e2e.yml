name: E2E

# The main chain (adopt, manifest/lock/ownership, plan, apply, runtime, rollback, remove) against a real
# npm DSH. Kept apart from CI: it needs the npm registry and a running dsh web, so it is not a merge gate.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'npm version or dist-tag of @deepseek-ai/dsh'
        default: '0.1.7-rc.2'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The verified DSH family; a new family is added here once the version gate is widened for it.
      # The input reaches the script through env, so it is never spliced into the shell text.
      - run: scripts/e2e-dsh.sh "$DSH_VERSION" "$RUNNER_TEMP/e2e"
        env:
          DSH_VERSION: ${{ inputs.dsh_version || '0.1.7-rc.2' }}
