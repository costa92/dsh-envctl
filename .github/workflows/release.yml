name: Release

on:
  push:
    tags: ['v*']
  # Run by hand to check both ways of publishing without publishing anything.
  workflow_dispatch:

permissions:
  contents: write
  # npm trusted publishing authenticates with the workflow's OIDC token and signs provenance with it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: verify-tag
        if: github.event_name == 'push'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - id: notes
        if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{f = ($2 == v); next} f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The tarball ships the built lib/, so installing it needs no build step.
      - run: pnpm pack --pack-destination dist
      # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - run: npm install -g npm@^11.5.1
      # The trusted publisher on npmjs.com is bound to this file name, so the check has to run here.
      # --force skips the already-published check; --dry-run still exchanges the OIDC token but uploads nothing.
      - id: check-oidc
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm publish ./dist/*.tgz --dry-run --force --access public --loglevel verbose 2>&1 | tee publish.log || true
          if ! grep -q 'oidc Successfully retrieved and set token' publish.log; then
            echo "::error::npm trusted publishing did not get a token: $(grep -m1 'npm verbose oidc' publish.log || echo 'no oidc log line')"
            exit 1
          fi
      - id: check-token
        if: github.event_name == 'workflow_dispatch' && !cancelled()
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Without ./ npm reads dist/<file> as a GitHub owner/repo shorthand. No token here: npm trusts this
      # workflow through OIDC and adds provenance itself; verbose logs why the exchange failed, if it does.
      - id: publish-oidc
        if: github.event_name == 'push'
        continue-on-error: true
        run: npm publish ./dist/*.tgz --access public --loglevel verbose
      - id: publish-token
        if: github.event_name == 'push' && steps.publish-oidc.outcome == 'failure'
        run: |
          echo "::warning::npm trusted publishing failed; publishing with NPM_TOKEN instead"
          npm publish ./dist/*.tgz --access public --provenance --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
