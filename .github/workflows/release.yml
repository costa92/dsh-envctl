name: Release

on:
  push:
    tags: ['v*']
  # Run by hand to check both ways of publishing without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Installs, tests and packs with read-only permissions: nothing a dependency runs here can publish.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: verify-tag
        if: github.event_name == 'push'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - id: notes
        if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{f = ($2 == v); next} f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The tarball ships the built lib/, so installing it needs no build step.
      - run: pnpm pack --pack-destination dist
      # What npm would install, run once: a tarball missing a file fails here, before anything is published.
      - id: smoke
        run: |
          tarball="$(ls "$PWD"/dist/*.tgz)"
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" --no-audit --no-fund "$tarball"
          version="$(node -p 'require("./package.json").version')"
          installed="$("$prefix/node_modules/.bin/dshenv" --version)"
          if [ "$installed" != "$version" ]; then
            echo "The packed dshenv reports version '$installed', expected $version" >&2
            exit 1
          fi
          "$prefix/node_modules/.bin/dshenv" --help >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: |
            dist/*.tgz
            release-notes.md
          if-no-files-found: error

  # Publishes the tarball the build job packed; it checks out and installs nothing.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # npm trusted publishing authenticates with the workflow's OIDC token and signs provenance with it.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No checkout here, so nothing to cache; setup-node v5+ would otherwise look for a package manager.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - run: npm install -g npm@11.20.0
      # The trusted publisher on npmjs.com is bound to this file name, so the check has to run here.
      # --force skips the already-published check; --dry-run still exchanges the OIDC token but uploads nothing.
      - id: check-oidc
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm publish ./dist/*.tgz --dry-run --force --access public --loglevel verbose 2>&1 | tee publish.log || true
          if ! grep -q 'oidc Successfully retrieved and set token' publish.log; then
            echo "::error::npm trusted publishing did not get a token: $(grep -m1 'npm verbose oidc' publish.log || echo 'no oidc log line')"
            exit 1
          fi
      - id: check-token
        if: github.event_name == 'workflow_dispatch' && !cancelled()
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Without ./ npm reads dist/<file> as a GitHub owner/repo shorthand. No token here: npm trusts this
      # workflow through OIDC and adds provenance itself; verbose logs why the exchange failed, if it does.
      - id: publish-oidc
        if: github.event_name == 'push'
        continue-on-error: true
        run: npm publish ./dist/*.tgz --access public --loglevel verbose
      - id: publish-token
        if: github.event_name == 'push' && steps.publish-oidc.outcome == 'failure'
        run: |
          echo "::warning::npm trusted publishing failed; publishing with NPM_TOKEN instead"
          npm publish ./dist/*.tgz --access public --provenance --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # No checkout in this job, so gh names the repository itself.
      - if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
