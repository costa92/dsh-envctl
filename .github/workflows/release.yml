name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # npm trusted publishing authenticates with the workflow's OIDC token and signs provenance with it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: verify-tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{f = ($2 == v); next} f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The tarball ships the built lib/, so installing it needs no build step.
      - run: pnpm pack --pack-destination dist
      # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - run: npm install -g npm@^11.5.1
      # npm tries trusted publishing (OIDC) first and falls back to NPM_TOKEN; verbose logs why OIDC was not used.
      # The trusted publisher is not registered on npmjs.com yet, so the token is what publishes today.
      # Without ./ npm reads dist/<file> as a GitHub owner/repo shorthand.
      - run: npm publish ./dist/*.tgz --access public --provenance --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
