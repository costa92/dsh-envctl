# DSHENV_SRC must point at a dsh-envctl checkout; it is passed as the `dshenv` build context.
services:
  dsh:
    build:
      context: .
      additional_contexts:
        dshenv: ${DSHENV_SRC:?set DSHENV_SRC to a dsh-envctl checkout}
    image: my-dsh
    ports:
      # Host loopback only: the web app executes commands for whoever reaches it.
      - '127.0.0.1:3080:3080'
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      # Session logs only; profiles/ and envctl/ must come from the image so each build re-applies the manifest.
      - dsh-data:/home/dsh/.dsh/sessions
volumes:
  dsh-data: {}
